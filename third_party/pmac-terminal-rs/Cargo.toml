[package]
name = "pmac-terminal"
version = "0.1.0"
edition = "2024"

[lib]
name = "pmac_terminal_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libloading = "=0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
