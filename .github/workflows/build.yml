name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "1.0.7"
  QT_VERSION: "6.8.3"
  QT_VERSION_MACOS: "6.9.2"
  PMAC_VERSION: "2.0.10"
  PMAC_REPO: "Sangmo467/communication-library-for-ppmac-rust"
  PMACT_ROOT: "${{ github.workspace }}/third_party/pmac-terminal-rs"

jobs:
  windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/pmac-terminal-rs

      - name: Download PMAC SDK
        run: |
          $name = "pmac-$env:PMAC_VERSION-x86_64-pc-windows-msvc-release"
          Invoke-WebRequest -Uri "https://github.com/$env:PMAC_REPO/releases/download/v$env:PMAC_VERSION/$name.zip" -OutFile pmac.zip
          Expand-Archive -Path pmac.zip -DestinationPath .

      - name: Build Rust terminal core
        run: cargo build --release --lib --locked --manifest-path third_party/pmac-terminal-rs/Cargo.toml

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPMAC_SDK_DIR="$PWD/pmac-$env:PMAC_VERSION-x86_64-pc-windows-msvc-release" `
            -DPMACT_ROOT="$env:PMACT_ROOT"

      - name: Build
        run: cmake --build build --parallel

      - name: Backend shutdown smoke
        timeout-minutes: 2
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          $test = Start-Process -FilePath "$PWD/dist/PmacTerminalApp.exe" -ArgumentList '--backend-shutdown-smoke' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput build/shutdown.out.log -RedirectStandardError build/shutdown.err.log
          Get-Content -Encoding UTF8 build/shutdown.out.log
          Get-Content -Encoding UTF8 build/shutdown.err.log
          exit $test.ExitCode

      - name: Widget shell focus smoke
        timeout-minutes: 2
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          $test = Start-Process -FilePath "$PWD/dist/PmacTerminalApp.exe" -ArgumentList '--terminal-focus-smoke' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput build/focus.out.log -RedirectStandardError build/focus.err.log
          Get-Content -Encoding UTF8 build/focus.out.log
          Get-Content -Encoding UTF8 build/focus.err.log
          exit $test.ExitCode

      - name: Package
        run: Compress-Archive -Path dist/* -DestinationPath "PmacTerminal-$env:APP_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PmacTerminal-windows-x64
          path: PmacTerminal-${{ env.APP_VERSION }}-windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_MACOS }}
          arch: clang_64
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/pmac-terminal-rs

      - name: Download PMAC SDK
        run: |
          name="pmac-$PMAC_VERSION-aarch64-apple-darwin-release"
          curl -fL -o pmac.zip "https://github.com/$PMAC_REPO/releases/download/v$PMAC_VERSION/$name.zip"
          unzip -q pmac.zip

      - name: Build Rust terminal core
        run: cargo build --release --lib --locked --manifest-path third_party/pmac-terminal-rs/Cargo.toml

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DPMAC_SDK_DIR="$PWD/pmac-$PMAC_VERSION-aarch64-apple-darwin-release" \
            -DPMACT_ROOT="$PMACT_ROOT"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee macos-build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          {
            echo '## macOS build log'
            echo '```text'
            cat macos-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            case "$line" in
              *"error:"*|*"CMake Error"*|*"FAILED:"*|*"clang:"*|*"ld:"*|*"codesign"*|*"install_name_tool"*)
                line=${line//'%'/'%25'}
                line=${line//$'\r'/'%0D'}
                echo "::error::$line"
                ;;
            esac
          done < macos-build.log

      # 直接验证部署产物，避免重新签名掩盖构建过程中对 bundle 的后续修改。
      - name: Verify deployed bundle
        run: |
          app="dist/PmacTerminalApp.app"
          test -f "$app/Contents/Frameworks/libpmac.dylib"
          test -f "$app/Contents/Frameworks/libpmac_terminal_core.dylib"
          test -f "$app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore"
          test -f "$app/Contents/Frameworks/QtQuick.framework/Versions/A/QtQuick"
          test -f "$app/Contents/Resources/translations/languages.json"
          codesign --verify --deep --strict --verbose=2 "$app"
          otool -L "$app/Contents/MacOS/PmacTerminalApp"
          otool -D "$app/Contents/Frameworks/libpmac.dylib"
          otool -D "$app/Contents/Frameworks/libpmac_terminal_core.dylib"

      - name: Terminal integration smoke
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: dist/PmacTerminalApp.app/Contents/MacOS/PmacTerminalApp --terminal-smoke

      - name: Backend shutdown smoke
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: dist/PmacTerminalApp.app/Contents/MacOS/PmacTerminalApp --backend-shutdown-smoke

      - name: Cocoa focus routing smoke
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: cocoa
          QT_QUICK_BACKEND: software
        run: dist/PmacTerminalApp.app/Contents/MacOS/PmacTerminalApp --terminal-focus-smoke

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/PmacTerminalApp.app "PmacTerminal-$APP_VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PmacTerminal-macos-arm64
          path: PmacTerminal-${{ env.APP_VERSION }}-macos-arm64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$APP_VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/PmacTerminal-windows-x64/*.zip \
            release/PmacTerminal-macos-arm64/*.zip \
            --title "PmacTerminal $APP_VERSION" \
            --generate-notes \
            --verify-tag
